version: "3.9"

# Production VPS — API + Telegram bot + nginx + certbot
# Local dev: docker-compose.dev.yml  |  Guide: deploy/DEPLOY.md

services:

  # ─── API FastAPI ────────────────────────────────────────────────────────────
  hub_api:
    build: .
    container_name: alnua_hub_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env.prod
    volumes:
      - ./worktrees:/app/worktrees      # Persist worktrees entre redémarrages
      - ./logs:/app/logs                 # Logs persistants
      - ./data:/app/data                 # cost_monitor, events, scores JSON
      - /home/alnua/.gitconfig:/home/alnua/.gitconfig:ro  # Git config du VPS
      - /home/alnua/.ssh:/home/alnua/.ssh:ro              # Clé SSH GitHub
    ports:
      - "127.0.0.1:8000:8000"           # Exposé seulement en local (nginx devant)
    networks:
      - alnua_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Bot Telegram ───────────────────────────────────────────────────────────
  hub_bot:
    build: .
    container_name: alnua_hub_bot
    restart: unless-stopped
    command: python -m bots.telegram_bot
    env_file: .env.prod
    volumes:
      - ./logs:/app/logs
    networks:
      - alnua_net
    depends_on:
      hub_api:
        condition: service_healthy

  # ─── Nginx (reverse proxy HTTPS) ────────────────────────────────────────────
  hub_nginx:
    image: nginx:alpine
    container_name: alnua_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - alnua_net
    depends_on:
      - hub_api

  # ─── Certbot (renouvellement SSL auto) ──────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: alnua_certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  alnua_net:
    driver: bridge

volumes:
  logs:
  worktrees:
